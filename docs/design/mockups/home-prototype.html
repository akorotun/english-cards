<!doctype html>
<html lang="uk" data-theme="light">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>English Cards — прототип головної</title>
<style>
:root{color-scheme:light;--page:#edf6ff;--surface:#fffefa;--soft:#e7f2ff;--text:#10244d;--muted:#526d91;--border:#c9ddf2;--primary:#1268d1;--on-primary:#fff;--shadow:0 18px 48px rgb(33 86 145 / 13%);font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
:root[data-theme=dark]{color-scheme:dark;--page:#0a1425;--surface:#17243b;--soft:#243757;--text:#f6f8ff;--muted:#b4c8e8;--border:#385170;--primary:#5ba9ff;--on-primary:#07162b;--shadow:0 18px 48px rgb(0 0 0 / 35%)}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top left,var(--soft),transparent 50%),var(--page);color:var(--text);line-height:1.5}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #ffb838;outline-offset:3px}.wrap{max-width:72rem;margin:auto;padding:0 1.25rem}.header{display:flex;align-items:center;justify-content:space-between;min-height:5rem;gap:1rem;border-bottom:1px solid var(--border)}.brand{font-size:1.15rem;font-weight:800;letter-spacing:-.03em}.toolbar{display:flex;gap:.5rem}.small{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:.75rem;padding:.5rem .7rem;font-size:.8rem;font-weight:700}.hero{display:grid;gap:2rem;padding:2.5rem 0 3rem}.eyebrow{color:var(--primary);font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;font-weight:800}h1{font-size:clamp(2.35rem,5vw,4.2rem);line-height:1.08;letter-spacing:-.045em;margin:.8rem 0 1.2rem;max-width:12ch} .intro{font-size:1.1rem;color:var(--muted);max-width:31rem;margin:0}.actions{display:flex;flex-wrap:wrap;gap:.75rem;margin-top:1.75rem}.button{border:1px solid var(--border);border-radius:.85rem;padding:.85rem 1.25rem;background:var(--surface);color:var(--text);font-weight:700;min-height:3rem}.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}.modes h2{font-size:1.15rem;letter-spacing:-.02em;margin:0 0 1rem}.mode-grid{display:grid;gap:.75rem}.mode{display:flex;gap:1rem;align-items:flex-start;border:1px solid var(--border);border-radius:1.25rem;background:var(--surface);padding:1.25rem}.icon{display:grid;place-items:center;flex:none;width:2.75rem;height:2.75rem;border-radius:.8rem;background:var(--soft);color:var(--primary)}.icon svg{width:1.5rem;height:1.5rem}.mode h3{margin:0 0 .25rem;font-size:1rem}.mode p{margin:0;color:var(--muted);font-size:.95rem}[hidden]{display:none!important}@media(max-width:24rem){.wrap{padding-inline:1rem}.header{gap:.5rem}.brand{font-size:1rem}.small{padding:.5rem;font-size:.75rem}.hero{padding-top:2rem;gap:1.75rem}h1{font-size:2.2rem}.actions{gap:.5rem}.button{padding-inline:1rem}.mode{padding:1rem;gap:.75rem}}@media(min-width:48rem){.hero{grid-template-columns:minmax(0,1fr) minmax(18rem,25rem);align-items:center;gap:clamp(2rem,5vw,4rem);padding:5rem 0}.modes{padding:0}}
</style></head>
<body><div class="wrap"><header class="header"><div class="brand">English Cards</div><div class="toolbar"><button class="small" id="theme" type="button">Темна тема</button><button class="small" id="state" type="button">Гість</button></div></header>
<main><section class="hero"><div><span class="eyebrow">English Cards</span><h1>Вивчайте англійські слова легко</h1><p class="intro">Обирайте теми, вивчайте слова за картками та перевіряйте, що вже запам’ятали.</p><div class="actions" id="guest"><button class="button primary" type="button">Зареєструватися</button><button class="button" type="button">Увійти</button></div><div class="actions" id="member" hidden><button class="button primary" type="button">Мій кабінет</button></div></div><section class="modes"><h2>Два режими для практики</h2><div class="mode-grid"><article class="mode"><span class="icon"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6.5C9.5 4.5 6.5 4 3 5v13c3.5-1 6.5-.5 9 1.5m0-13C14.5 4.5 17.5 4 21 5v13c-3.5-1-6.5-.5-9 1.5m0-13v13"/></svg></span><div><h3>Навчання</h3><p>Знайомтеся зі словами, перекладами та вимовою</p></div></article><article class="mode"><span class="icon"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12 2.5 2.5L16 9"/></svg></span><div><h3>Перевірка</h3><p>Пригадуйте переклад, перевіряйте себе та відстежуйте прогрес</p></div></article></div></section></section></main></div>
<script>if(new URLSearchParams(location.search).get('theme')==='dark'){document.documentElement.dataset.theme='dark';document.querySelector('#theme').textContent='Світла тема'};document.querySelector('#theme').addEventListener('click',function(){let dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'light';this.textContent=dark?'Світла тема':'Темна тема'});document.querySelector('#state').addEventListener('click',function(){let member=document.querySelector('#member');member.hidden=!member.hidden;document.querySelector('#guest').hidden=!member.hidden;this.textContent=member.hidden?'Гість':'Авторизований'});</script></body></html>
